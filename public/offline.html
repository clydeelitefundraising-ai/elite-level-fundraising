<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Level Fundraising — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b1e3d;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    padding-top: max(1.5rem, env(safe-area-inset-top, 0px));
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .mark {
    width: 88px;
    height: 88px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .mark img {
    width: 66px;
    height: 66px;
    object-fit: contain;
  }
  h1 {
    margin: 0 0 .6rem;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  p {
    margin: 0 0 1.75rem;
    font-size: .92rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, .78);
  }
  button {
    appearance: none;
    border: none;
    width: 100%;
    padding: .85rem 1.25rem;
    background: #c4a35a;
    color: #0b1e3d;
    font-size: 1rem;
    font-weight: 800;
    border-radius: .75rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: .65;
    cursor: default;
  }
  button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  #status {
    margin-top: 1rem;
    font-size: .82rem;
    color: rgba(255, 255, 255, .65);
    min-height: 1.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .35);
    border-top-color: #fff;
    animation: elf-spin .8s linear infinite;
    flex-shrink: 0;
    display: none;
  }
  .spinner.active { display: inline-block; }
  @keyframes elf-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
  }
</style>
</head>

  <h1>Can&rsquo;t reach Elite Level Fundraising</h1>
  <p id="message">We&rsquo;re having trouble connecting right now. Check your internet connection and try again.</p>
  <button type="button" id="retryBtn">Retry</button>
  <p id="status" role="status" aria-live="polite">
    <span class="spinner" id="spinner" aria-hidden="true"></span>
    <span id="statusText"></span>
  </p>
</main>
<script>
(function () {
  // Must match capacitor.config.ts's server.url. This page ships locally in
  // the app bundle (webDir) and is shown by Capacitor's built-in
  // server.errorPath mechanism on Android and iOS whenever the WebView fails
  // to load that URL — DNS/TLS/timeout/no-connectivity/cold-launch failures,
  // and HTTP 4xx/5xx. Retrying is just re-attempting navigation to it; if it
  // fails again, Capacitor's native error handler redirects back here.
  var TARGET_URL = 'https://app.elitelevelfundraising.com';
  var PROBE_INTERVAL_MS = 5000;
  var PROBE_TIMEOUT_MS = 4000;

  var retryBtn = document.getElementById('retryBtn');
  var spinner = document.getElementById('spinner');
  var statusText = document.getElementById('statusText');
  var messageEl = document.getElementById('message');
  var probeTimer = null;
  var attempting = false;

  function setStatus(text, busy) {
    statusText.textContent = text || '';
    spinner.classList.toggle('active', !!busy);
  }

  function goToApp() {
    if (attempting) return;
    attempting = true;
    retryBtn.disabled = true;
    setStatus('Checking connection…', true);
    window.location.href = TARGET_URL;
    // If navigation fails, Capacitor's own error handling re-loads this page
    // (a fresh document, so this script re-runs from a clean state) — no
    // failure branch needed here.
  }

  function probeAndMaybeRetry() {
    if (attempting) return;
    if (typeof navigator.onLine === 'boolean' && navigator.onLine === false) return;

    var controller = ('AbortController' in window) ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, PROBE_TIMEOUT_MS) : null;

    fetch(TARGET_URL, {
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    }).then(function () {
      if (timeoutId) clearTimeout(timeoutId);
      goToApp();
    }).catch(function () {
      if (timeoutId) clearTimeout(timeoutId);
      // still unreachable — keep waiting for the next probe/online event
    });
  }

  retryBtn.addEventListener('click', goToApp);

  window.addEventListener('online', function () {
    messageEl.textContent = 'Connection detected — checking…';
    probeAndMaybeRetry();
  });

  window.addEventListener('offline', function () {
    setStatus('Waiting for a connection…', false);
  });

  if (typeof navigator.onLine !== 'boolean' || navigator.onLine) {
    setStatus('Checking connection in the background…', false);
  } else {
    setStatus('Waiting for a connection…', false);
  }

  probeTimer = setInterval(probeAndMaybeRetry, PROBE_INTERVAL_MS);
  window.addEventListener('beforeunload', function () {
    if (probeTimer) clearInterval(probeTimer);
  });
})();
</script>
