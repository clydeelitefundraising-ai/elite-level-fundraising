apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Release signing is only "available" when every required field is present and the keystore
// file it points at exists. Release packaging is refused otherwise (see the guard at the bottom
// of this file) -- it must never fall back to the debug key.
def releaseSigningProblems = []
if (!keystorePropertiesFile.exists()) {
    releaseSigningProblems << "android/keystore.properties does not exist"
} else {
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!keystoreProperties[key]?.toString()?.trim()) {
            releaseSigningProblems << "keystore.properties is missing '${key}'".toString()
        }
    }
    if (keystoreProperties['storeFile']?.toString()?.trim() &&
            !rootProject.file(keystoreProperties['storeFile'].toString().trim()).exists()) {
        releaseSigningProblems << "keystore file '${keystoreProperties['storeFile']}' does not exist".toString()
    }
}
def hasReleaseSigning = releaseSigningProblems.isEmpty()

android {
    namespace = "com.elitelevelfundraising.team"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.elitelevelfundraising.team"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // No debug-key fallback: without release credentials the build is refused by the
            // guard at the bottom of this file, so a debug-signed release can never be produced.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Release-signing guard: fails the build at task-graph time (before any compilation) whenever a
// release packaging task (assembleRelease / bundleRelease / packageRelease) is requested without
// complete release signing credentials. Debug builds, lint and Android Studio sync are unaffected.
gradle.taskGraph.whenReady { graph ->
    def releasePackaging = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /^(assemble|bundle|package)\w*Release(Bundle)?$/
    }
    if (releasePackaging && !hasReleaseSigning) {
        throw new GradleException(
            "Refusing to build a release artifact without release signing credentials " +
            "(it would otherwise be signed with the debug key).\n" +
            "Problems: ${releaseSigningProblems.join('; ')}.\n" +
            "Create android/keystore.properties (copy android/keystore.properties.example) " +
            "pointing at your release keystore, then re-run. Debug builds are unaffected."
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
